services:
  - type: web
    name: civicsathi-ai-api-gowtham-888
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://civicsathi-ai-gowtham-888.onrender.com
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: civicsathi-ai-gowtham-888
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    region: singapore
    envVars:
      - key: VITE_API_URL
        value: https://civicsathi-ai-api-gowtham-888.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
